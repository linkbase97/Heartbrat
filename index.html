<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>心跳</title>
<style>
:root{--bg:#f4f0fa;--ink:#2b2340;--sub:#7a7390;--accent:#c23a78;--on:#fff;--card:#fff;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18132a;--ink:#f1edf9;--sub:#b3abd0;--accent:#e0679a;--on:#1b1230;--card:#241d3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18132a;--ink:#f1edf9;--sub:#b3abd0;--accent:#e0679a;--on:#1b1230;--card:#241d3a;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;
 font:16px/1.5 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#stage{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none}
#score{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
#lives{font-size:26px;color:var(--accent);letter-spacing:.1em}
#combo{position:absolute;left:0;right:0;top:66px;text-align:center;color:var(--ink);font-size:20px;font-weight:700;pointer-events:none;min-height:30px}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(84vw,340px);background:var(--card);border-radius:22px;padding:28px 24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#panel h1{margin:0 0 8px;font-size:34px}
#panel p{margin:0 0 20px;color:var(--sub);white-space:pre-line}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 28px;background:var(--accent);color:var(--on);cursor:pointer;width:100%}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.5}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
#settings,#board{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.sheet{background:var(--card);color:var(--ink);border-radius:22px;padding:22px;width:min(88vw,360px)}
.sheet h2{margin:0 0 6px}
.srow{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:10px}
.srow input[type=range]{width:55%;accent-color:var(--accent)}
.nudge{display:flex;gap:8px}
.nudge button{width:44px;padding:8px 0;margin:0}
.note{color:var(--sub);font-size:13px;margin:6px 0 12px}
#pauseBtn{position:absolute;right:16px;top:58px;width:44px;height:44px;padding:0;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:18px}
#calText,#tutText{position:absolute;left:0;right:0;top:16%;padding:0 20px;text-align:center;font-size:21px;font-weight:800;pointer-events:none;color:var(--ink);white-space:pre-line;text-shadow:0 1px 8px var(--bg)}
#home{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:7% 24px 30px;pointer-events:none}
#home>*{pointer-events:auto}
#logo{text-align:center;pointer-events:none}
#logo h1{margin:0;font-size:68px;font-weight:900;letter-spacing:.08em;color:var(--ink);text-shadow:0 3px 0 var(--accent),0 6px 18px rgba(0,0,0,.25)}
#logo p{margin:2px 0 0;color:var(--sub);letter-spacing:.3em;font-size:12px;font-weight:700}
#menu{width:min(86vw,360px);display:flex;flex-direction:column;gap:12px;align-items:stretch}
#homeInfo{text-align:center;color:var(--ink);font-weight:700;text-shadow:0 1px 8px var(--bg)}
button.big{font-size:22px;padding:18px}
.three{display:flex;gap:10px}
.three button{flex:1;padding:12px 6px;margin:0;background:var(--card);color:var(--ink);border:2px solid var(--sub)}
.sheet.wide{width:min(92vw,400px)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;margin:0;padding:10px;background:transparent;color:var(--sub);border-radius:10px;border:2px solid transparent}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
#boardList{list-style:none;margin:0;padding:0;max-height:40vh;overflow:auto}
#boardList li{display:grid;grid-template-columns:2.4em 1fr auto auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid rgba(128,128,128,.25)}
#boardList li.me{background:rgba(224,103,154,.2);border-radius:8px}
#boardList .sc{font-weight:800;font-variant-numeric:tabular-nums}
.sheet select{width:55%;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--sub);background:var(--bg);color:var(--ink)}
#skipBtn{position:absolute;right:16px;top:12px;width:auto;padding:8px 14px;background:rgba(0,0,0,.35);color:#fff;font-size:14px}
.two{display:flex;gap:10px;margin-top:10px}
.two button{margin:0}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);margin-top:10px}
#shareView{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;overflow:auto}
#shareView img{max-width:100%;max-height:56vh;border-radius:14px;-webkit-touch-callout:default}
#hint{margin:0;color:#d9d2ee;font-size:14px}
#shareTxt{width:min(92vw,360px);font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--sub);background:var(--card);color:var(--ink);padding:8px;user-select:text;-webkit-user-select:text;resize:none}
#shareView .row{display:flex;gap:10px;width:min(92vw,360px)}
#shareView .row button{margin:0}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="home" class="hide">
    <div id="logo"><h1>心跳</h1><p>HEARTBEAT</p></div>
    <div id="menu">
      <div id="homeInfo"></div>
      <button id="homeStart" class="big">开始游戏</button>
      <div class="three"><button id="homeBoard">排行榜</button><button id="homeHow">玩法</button><button id="homeSet">设置</button></div>
    </div>
  </div>
  <div id="hud"><div id="score">0</div><div id="lives"></div></div>
  <div id="combo"></div>
  <button id="pauseBtn" class="hide" aria-label="暂停">⏸</button>
  <div id="calText" class="hide"></div>
  <div id="tutText" class="hide"></div>
  <button id="skipBtn" class="hide">跳过</button>
  <div id="panel"><h1 id="pt">心跳</h1><p id="pp"></p><button id="go">开始</button><button id="share" class="ghost hide">分享成绩</button><div class="two"><button id="setBtn" class="ghost">设置</button><button id="homeBtn" class="ghost">主页</button></div></div>
  <div id="settings" class="hide"><div class="sheet"><h2>设置</h2>
    <div class="srow"><label for="vol">音量</label><input id="vol" type="range" min="0" max="100"></div>
    <div class="srow"><span>昵称 <b id="nickVal"></b></span><button id="nickBtn" class="ghost" style="width:auto;padding:8px 14px;margin:0">换一个</button></div>
    <div class="srow"><label for="ctry">国家/地区</label><select id="ctry"></select></div>
    <div class="srow"><label for="calmChk">减弱闪光和抖动</label><input id="calmChk" type="checkbox"></div>
    <div class="srow"><span>判定偏移 <b id="calVal">0 ms</b></span><span class="nudge"><button id="calMinus" class="ghost" aria-label="减少 5 毫秒">−</button><button id="calPlus" class="ghost" aria-label="增加 5 毫秒">＋</button></span></div>
    <p class="note">觉得点得准，却总被判早或判晚？戴上平时玩游戏的耳机，点“自动测量”，跟着节拍点十下。</p>
    <button id="calBtn">自动测量</button><p id="calMsg" class="note"></p>
    <button id="closeSet" class="ghost">完成</button></div></div>
  <div id="board" class="hide"><div class="sheet wide"><h2>排行榜</h2>
    <div class="tabs"><button id="tabG" class="on">全球</button><button id="tabC">本国</button></div>
    <div id="boardMe" class="note"></div>
    <ol id="boardList"></ol>
    <p id="boardMsg" class="note"></p>
    <button id="closeBoard" class="ghost">关闭</button></div></div>
  <div id="shareView" class="hide"><img id="cardImg" alt="成绩图片"><p id="hint">长按图片保存，再发到社交媒体</p><textarea id="shareTxt" readonly rows="2"></textarea><div class="row"><button id="copy">复制文字</button><button id="closeShare" class="ghost">关闭</button></div></div>
</div>
<script>
/* ===== 排行榜需要 Supabase：部署到自己的网址后，把这两行填上（留空则排行榜显示未连接） ===== */
const SUPABASE_URL = "https://teuzsxnytvyxfbxkxdsw.supabase.co";
const SUPABASE_KEY = "sb_publishable_TddCROy89FCYei4N-UOhZQ_AJIskn9z";
const $ = s => document.querySelector(s);
const cv = $("#c"), ctx = cv.getContext("2d");
const TRAVEL = 1.4, MAXT = 2.3, PERFECT = .055, GOOD = .12, NEAR = .23;
const HUES = [335, 280, 190, 40];
let W, H, dpr, cx, cy, R0, RS, css, dark;
let state = "idle", rings = [], pops = [], parts = [], flo = [], ripples = [], loops = [];
let genT = 0, sl = 0, ss = 0, introUntil = 0, hits = 0, score = 0, combo = 0, lives = 3, best = 0, perfects = 0, res = { score: 0, rate: 0 };
let ac = null, master, noiseBuf, pumpTimer = null, last = 0, hue = 335, hitPulse = 0, mood = 0, moodT = 0;
try { best = +localStorage.getItem("heartbeat-best-v2") || 0; } catch (e) {}
let cfg = { vol: .8, calm: false, cal: 0, tut: false, dev: "", name: "", country: "", sub: false };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("heartbeat-cfg") || "{}")); } catch (e) {}
const pick = a => a[Math.floor(Math.random() * a.length)];
const newName = () => pick(["害羞", "闪亮", "暴躁", "慵懒", "机灵", "迷糊", "勇敢", "魔性", "快乐", "酷酷", "软软", "跳跳"]) + "的" + pick(["企鹅", "柴犬", "仙人掌", "小鲸鱼", "团子", "章鱼", "刺猬", "年糕", "兔子", "鸭鸭", "云朵", "布丁"]) + (10 + Math.floor(Math.random() * 90));
if (!cfg.dev) cfg.dev = window.crypto && crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
if (!cfg.name) cfg.name = newName();
try { localStorage.setItem("heartbeat-cfg", JSON.stringify(cfg)); } catch (e) {}
let runStart = 0;

const clock = () => ac ? ac.currentTime : performance.now() / 1000;
const latency = () => ac ? Math.min(.3, (ac.outputLatency || 0) + (ac.baseLatency || 0)) : 0;
function readCss() {
  const s = getComputedStyle(document.documentElement), g = n => s.getPropertyValue(n).trim();
  css = { ink: g("--ink"), sub: g("--sub") };
  dark = matchMedia("(prefers-color-scheme:dark)").matches ? document.documentElement.dataset.theme !== "light" : document.documentElement.dataset.theme === "dark";
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H * .48; R0 = Math.min(W, H) * .11; RS = Math.min(W, H) * .46;
  readCss();
  if (!flo.length) for (let i = 0; i < 16; i++) flo.push({ x: Math.random(), y: Math.random(), s: 6 + Math.random() * 14, v: .02 + Math.random() * .04 });
}
addEventListener("resize", resize);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", readCss);
const col = (dl = 0, a = 1) => `hsl(${hue + dl} 85% ${dark ? 68 : 50}% / ${a})`;

/* ---------- 合成乐器 ---------- */
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = cfg.vol;
  master.connect(comp); comp.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function env(g, t, v, d) { g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); }
function osc(type, f1, f2, t, d, v, dest) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
  o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  env(g, t, v, d); o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + .02);
}
function noise(t, d, v, ft, fq) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = ft; f.frequency.value = fq; env(g, t, v, d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .02);
}
const kick = t => osc("sine", 160, 42, t, .22, .95);
const clap = t => { noise(t, .14, .5, "bandpass", 1600); noise(t + .012, .1, .35, "bandpass", 2100); };
const hat = (t, o) => noise(t, o ? .12 : .04, o ? .16 : .1, "highpass", 7500);
const bass = (t, n) => { const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420; f.connect(master); osc("sawtooth", midi(n), 0, t, .2, .3, f); };
const pluck = (t, n, v) => { osc("triangle", midi(n), 0, t, .28, v); osc("sine", midi(n) * 2, 0, t, .12, v * .4); };
const bell = t => { osc("square", 540, 0, t, .08, .07); osc("square", 810, 0, t, .08, .07); };

/* ---------- 音乐与谱面（两小节一段，十六个八分音符） ---------- */
const KS = [0, 3, 6, 8, 11, 14], BN = [36, 36, 39, 41, 41, 43];
const MEL = { 0: 67, 2: 70, 3: 67, 5: 65, 6: 67, 8: 63, 10: 65, 11: 67, 13: 70, 14: 72 };
const SC = [67, 70, 72, 75, 77];
const PATS = [[0, 4, 8, 12], [0, 4, 8, 10, 12], [0, 3, 6, 8, 11, 14], [0, 2, 4, 6, 8, 10, 12, 14], [0, 3, 4, 8, 11, 12, 14], [0, 2, 4, 6, 8, 10, 11, 12, 14]];
function playStep(L, s, t) {
  const ki = KS.indexOf(s);
  if (ki >= 0) { kick(t); bass(t, BN[ki]); ripples.push(t); }
  if (s === 4 || s === 12) clap(t);
  hat(t, s % 4 === 2);
  if (L.stage >= 1 && MEL[s]) pluck(t, MEL[s], .13);
  if (L.stage >= 2 && s % 2) bell(t);
  if (L.stage >= 3 && s % 4 === 0) pluck(t, (MEL[s] || 67) + 12, .07);
}
/* 快慢刀：每个圆环有自己的速度曲线，但到达中心的时刻永远踩在鼓点上 */
function motion(stage) {
  if (stage < 1 || Math.random() < .35) return { kind: 0, travel: TRAVEL };
  const pool = stage >= 2 ? [1, 2, 3] : [1, 2], kind = pool[Math.floor(Math.random() * pool.length)];
  return { kind, travel: kind === 1 ? 2.2 : kind === 2 ? .95 : 2.0 };
}
function ease(kind, p) {
  p = Math.max(0, p);
  if (kind === 1) return Math.pow(p, 2.2);
  if (kind === 2) return p > 1 ? p : 1 - Math.pow(1 - p, 2.2);
  if (kind === 3) return p < .55 ? p / .55 * .7 : p < .85 ? .7 + .05 * (p - .55) / .3 : .75 + .25 * Math.pow((p - .85) / .15, 2);
  return p;
}
function genLoop(empty) {
  const stage = Math.floor(hits / 12);
  const pi = Math.min(PATS.length - 1, Math.max(0, stage - (Math.random() < .4 ? 1 : 0)));
  let bpm = Math.min(138, 106 + 4 * stage);
  if (!empty && stage >= 2) bpm += [-8, 0, 8, 14][Math.floor(Math.random() * 4)];
  const sd = 60 / bpm / 2;
  const L = { t: genT, sd, stage: Math.min(stage, 3) }; loops.push(L);
  if (!empty) for (const s of PATS[pi]) rings.push({ hit: L.t + s * sd, done: false, ...motion(stage) });
  genT += 16 * sd;
}
function pump() {
  if (!ac || state !== "play") return;
  const now = ac.currentTime;
  while (sl < loops.length) {
    const L = loops[sl], t = L.t + ss * L.sd;
    if (t > now + .15) break;
    playStep(L, ss, t); if (++ss === 16) { ss = 0; sl++; }
  }
}

/* ---------- 流程 ---------- */
function pop(text, c) { pops.push({ text, c, t: performance.now() }); }
function burst(n, c) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = 120 + Math.random() * 220;
    parts.push({ x: hx, y: hy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 1, s: 3 + Math.random() * 5, c, h: Math.random() < .4 });
  }
}
function hud() {
  $("#score").textContent = score;
  $("#lives").textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
  $("#combo").textContent = state === "play" && clock() < introUntil ? "先听两小节鼓点…" : combo >= 5 ? combo + " 连击" : "";
}
function showPanel(t, p, b, sh) { $("#pt").textContent = t; $("#pp").textContent = p; $("#go").textContent = b; $("#share").classList.toggle("hide", !sh); $("#home").classList.add("hide"); $("#pauseBtn").classList.add("hide"); $("#panel").classList.remove("hide"); }
function start() {
  if (!ac) { try { initAudio(); } catch (e) { ac = null; } }
  if (ac && ac.state === "suspended") ac.resume();
  rings = []; pops = []; parts = []; ripples = []; loops = []; sl = ss = 0;
  sceneSeq = Array.from({ length: 12 }, () => Math.floor(Math.random() * 10)); faces = []; lastKickSeen = -9; lastScene = -1; flash = glitch = 0;
  score = combo = hits = perfects = 0; lives = 3; hue = HUES[0]; state = "play";
  genT = clock() + .15; genLoop(true); introUntil = genT - MAXT;
  lastHopSeen = -9; wp = null; hx = cx; hy = cy;
  clearInterval(pumpTimer); pumpTimer = setInterval(pump, 25);
  $("#panel").classList.add("hide"); $("#home").classList.add("hide"); $("#pauseBtn").classList.remove("hide"); runStart = performance.now(); hud();
}
function end() {
  state = "over"; clearInterval(pumpTimer);
  if (ac) { osc("sawtooth", 300, 60, ac.currentTime, .6, .35); }
  const fresh = score > best;
  if (fresh) { best = score; try { localStorage.setItem("heartbeat-best-v2", best); } catch (e) {} }
  const rate = hits ? Math.round(perfects / hits * 100) : 0; res = { score, rate };
  showPanel("得分 " + score, "完美率 " + rate + "%\n" + (fresh ? "新纪录！" : "最高 " + best), "再来一次", true);
  if (score > 0 && (fresh || !cfg.sub)) submitScore(score, (performance.now() - runStart) / 1000).then(r => { if (r && state === "over") $("#pp").textContent += "\n全球第 " + r.global + " 名 · " + cname(r.cc) + "第 " + r.country + " 名"; });
  const b = $("#go"); b.disabled = true; setTimeout(() => b.disabled = false, 700);
}
function setMood(m) { mood = m; moodT = performance.now(); }
function loseLife(label) {
  lives--; combo = 0; pop(label, css.sub); setMood(-1);
  if (ac) osc("sawtooth", 120, 50, ac.currentTime, .25, .3);
  hud(); if (lives <= 0) end();
}
function tap() {
  if (state === "tut") return tutTap();
  if (state !== "play") return;
  const n = clock() - latency() - cfg.cal;
  let near = null, nd = 1e9;
  for (const r of rings) { if (r.done) continue; const d = Math.abs(n - r.hit); if (d < nd) { nd = d; near = r; } }
  if (!near || nd > NEAR) { combo = 0; pop("太早了", css.sub); if (ac) osc("square", 200, 100, ac.currentTime, .08, .15); hud(); return; }
  near.done = true;
  if (nd <= GOOD) {
    const perfect = nd <= PERFECT;
    score += perfect ? 2 : 1; if (perfect) perfects++;
    if (ac) { pluck(ac.currentTime, SC[combo % 5], .26); if (perfect) bell(ac.currentTime); }
    combo++; hits++; hitPulse = 1; setMood(1);
    pop(perfect ? "完美" : "不错", col(perfect ? 0 : 40)); burst(perfect ? 18 : 8, col(Math.random() * 60));
  } else { combo = 0; pop("差一点", css.sub); setMood(-1); if (ac) osc("square", 300, 150, ac.currentTime, .1, .15); }
  hud();
}
addEventListener("pointerdown", e => { if (!e.target.closest("button") && !e.target.closest("#settings")) press(); });
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); press(); } else if (e.code === "Escape" || e.code === "KeyP") pause(); });
$("#go").onclick = () => state === "paused" ? resumeGame() : !cfg.tut ? startTutorial() : start();
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") pause(); });

/* ---------- 暂停 / 设置 / 延迟校准 ---------- */
let calBeats = [], calTaps = [], calPrev = "idle", calShown = -1;
const saveCfg = () => { try { localStorage.setItem("heartbeat-cfg", JSON.stringify(cfg)); } catch (e) {} };

/* ---------- 会跑的爱心：越到后面跑得越远、越勤 ---------- */

function moveHeart(now, dt) {
  const stage = state === "play" ? Math.min(3, Math.floor(hits / 12)) : state === "tut" && tutStep >= 2 ? 2 : 0;
  const k = calm ? .5 : 1, ax = W * [0, .08, .2, .3][stage] * k, ay = H * [0, .05, .12, .17][stage] * k;
  let tx = cx, ty = cy;

  else if (stage >= 2) {
    for (const t of ripples) if (t <= now && t > lastHopSeen) {
      lastHopSeen = t; kickN++;
      if (stage === 3 || kickN % 2 === 0) wp = { x: (Math.random() * 2 - 1) * ax, y: (Math.random() * 2 - 1) * ay };
    }
    if (wp) { tx += wp.x; ty += wp.y; }
  }
  if (stage >= 1) { tx = Math.max(R0 * 1.8, Math.min(W - R0 * 1.8, tx)); ty = Math.max(110 + R0, Math.min(H - R0 * 2, ty)); }
  const f = Math.min(1, dt * (stage >= 2 ? 12 : 6));

    else if (f.eyes === 2) {
      ctx.fillStyle = "#fff"; ctx.arc(x, ey, er, 0, 7); ctx.fill(); ctx.stroke(); ctx.beginPath();
      for (let k = 0; k < 30; k++) { const q = k * .45 + performance.now() / 150, rr = er * .9 * k / 30; ctx.lineTo(x + Math.cos(q) * rr, ey + Math.sin(q) * rr); }
      ctx.stroke();
    }
    else if (f.eyes === 3) {
      ctx.fillStyle = "#fff"; ctx.arc(x, ey, er * (sx > 0 ? 1.2 : .6), 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle = INK; ctx.arc(x + sx * 2, ey, er * .3, 0, 7); ctx.fill();
    }
    else if (f.eyes === 4) {
      ctx.fillStyle = "#ffe14d";
      for (let k = 0; k < 10; k++) { const rr = k % 2 ? er * .45 : er * 1.1, q = -1.57 + k * Math.PI / 5; ctx.lineTo(x + Math.cos(q) * rr, ey + Math.sin(q) * rr); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    else { ctx.moveTo(x - er, ey); ctx.lineTo(x + er, ey); ctx.stroke(); }
  }
  const my = s * .38; ctx.beginPath();
  if (f.mouth === 0) { ctx.ellipse(0, my, s * .5, s * (.12 + .25 * beat), 0, 0, Math.PI); ctx.closePath(); ctx.fillStyle = "#7a1030"; ctx.fill(); ctx.stroke(); }
  else if (f.mouth === 1) {
    ctx.arc(0, my - s * .1, s * .4, .1, Math.PI - .1); ctx.stroke();
    ctx.beginPath(); ctx.fillStyle = "#ff6b8a"; ctx.ellipse(s * .1, my + s * .25, s * .12, s * .2, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  else if (f.mouth === 2) { ctx.arc(0, my, s * (.14 + .1 * beat), 0, 7); ctx.fillStyle = "#7a1030"; ctx.fill(); ctx.stroke(); }
  else { for (let k = 0; k <= 6; k++) ctx.lineTo(-s * .5 + k * s / 6, my + (k % 2 ? s * .12 : -s * .12)); ctx.stroke(); }
  if (f.shout) {
    ctx.font = `800 ${Math.round(s * .55)}px -apple-system,'PingFang SC',sans-serif`; ctx.textAlign = "center";
    ctx.lineWidth = s * .12; ctx.strokeStyle = INK; ctx.strokeText(f.shout, 0, -s * 1.15); ctx.fillStyle = "#fff"; ctx.fillText(f.shout, 0, -s * 1.15);
  }
  ctx.restore(); return true;
}
function drawBackdrop(now, dt, beat, idle) {
  const stage = Math.min(3, Math.floor(hits / 12));
  let id = 0;
  if (!idle && sceneSeq.length) id = sceneSeq[Math.floor(curLoop(now) / 2) % sceneSeq.length] % Math.min(5, 1 + stage * 2);
  if (id !== lastScene) { if (lastScene >= 0 && !idle && !calm) flash = 1; lastScene = id; }
  flash = Math.max(0, flash - dt / .3);
  if (!idle) for (const t of ripples) if (t <= now && t > lastKickSeen) {
    lastKickSeen = t;
    if (stage >= 1 && faces.length < 5 && Math.random() < .25 + .15 * stage) faces.push(newFace());
    if (stage >= 3 && !calm && Math.random() < .5) glitch = .18;
  }
  ctx.save();
  const sh = !idle && !calm && stage >= 2 ? beat * (stage - 1) * 3 : 0;
  ctx.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
  scene(id, now, beat);
  for (const f of flo) {
    f.y -= f.v * dt; if (f.y < -.05) { f.y = 1.05; f.x = Math.random(); }
    heartPath(f.x * W, f.y * H, f.s); ctx.fillStyle = col(20, .13); ctx.fill();
  }
  faces = faces.filter(f => drawFace(f, beat, dt));
  if (glitch > 0) { glitch -= dt; for (let i = 0; i < 3; i++) { ctx.fillStyle = `hsl(${(hue + 180) % 360} 90% 60% / .35)`; ctx.fillRect(0, rnd(0, H), W, rnd(6, 26)); } }
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${.5 * flash})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- 更新与绘制 ---------- */
function update(now) {
  while (genT < clock() + 3.4) genLoop(false);
  for (const r of rings) if (!r.done && now > r.hit + .2) { r.done = true; loseLife("错过"); if (state !== "play") return; }
  rings = rings.filter(r => now < r.hit + .5);
  if (clock() >= introUntil && $("#combo").textContent.startsWith("先听")) hud();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .9);
  ctx.bezierCurveTo(x - s * 1.3, y + s * .1, x - s * .9, y - s * .9, x, y - s * .35);
  ctx.bezierCurveTo(x + s * .9, y - s * .9, x + s * 1.3, y + s * .1, x, y + s * .9); ctx.closePath();
}
function draw(now, dt) {
  const idle = state !== "play" && state !== "tut";
  while (ripples.length > 1 && now - ripples[0] > .8) ripples.shift();
  let lk = -9; for (const t of ripples) if (t <= now) lk = t;
  const beat = state === "calib" ? calBeat(now) : idle ? .5 + .5 * Math.sin(now * 4) : Math.exp(-(now - lk) * 7);
  const target = HUES[Math.min(3, Math.floor(hits / 12))];
  hue += (target - hue) * Math.min(1, dt * 1.5);
  drawBackdrop(now, dt, beat, idle);
  // 鼓点涟漪
  for (const t of ripples) {
    const a = (now - t) / .7; if (a < 0 || a > 1) continue;
    ctx.beginPath(); ctx.arc(hx, hy, R0 * (1.2 + a * 2.4), 0, 7);
    ctx.strokeStyle = col(0, .35 * (1 - a)); ctx.lineWidth = 3; ctx.stroke();
  }
  // 逼近的心形
  if (!idle) for (const r of rings) {
    if (r.done) continue;
    const tv = r.travel || TRAVEL, p = (now - (r.hit - tv)) / tv; if (p < 0) continue;
    const s = Math.max(4, R0 + (RS - R0) * (1 - ease(r.kind || 0, p))), close = Math.max(0, 1 - Math.abs(p - 1) * 6);
    ctx.globalAlpha = Math.min(1, p * 2 + .15);
    heartPath(hx, hy, s); ctx.lineWidth = 11 + 4 * close; ctx.strokeStyle = "rgba(20,12,40,.75)"; ctx.stroke();
    heartPath(hx, hy, s); ctx.lineWidth = 5 + 3 * close; ctx.strokeStyle = close > 0 ? col(0, 1) : "#fff"; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 中心的心（会表情）
  hitPulse = Math.max(0, hitPulse - dt / .25);
  const s = R0 * (1 + .1 * beat + .25 * hitPulse);
  ctx.save(); ctx.translate(hx, hy); ctx.scale(1 + .05 * beat, 1 - .05 * beat);
  heartPath(0, 0, s); ctx.fillStyle = col(0, .95); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = css.ink; ctx.stroke();
  const m = performance.now() - moodT < 450 ? mood : 0;
  ctx.fillStyle = css.ink; ctx.strokeStyle = css.ink; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(-s * .3, -s * .05, s * .07, 0, 7); ctx.arc(s * .3, -s * .05, s * .07, 0, 7); ctx.fill();
  ctx.beginPath();
  if (m >= 0) ctx.arc(0, s * .1, s * (m > 0 ? .26 : .17), .1 * Math.PI, .9 * Math.PI); else ctx.arc(0, s * .42, s * .16, 1.15 * Math.PI, 1.85 * Math.PI);
  ctx.stroke(); ctx.restore();
  // 粒子
  parts = parts.filter(q => q.life > 0);
  for (const q of parts) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 260 * dt; q.life -= dt * 1.4;
    ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.c;
    if (q.h) { heartPath(q.x, q.y, q.s * 1.4); ctx.fill(); } else { ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // 判定文字
  pops = pops.filter(q => performance.now() - q.t < 600);
  ctx.textAlign = "center"; ctx.font = "800 32px -apple-system,'PingFang SC',sans-serif";
  for (const q of pops) {
    const a = (performance.now() - q.t) / 600;
    ctx.globalAlpha = 1 - a; ctx.fillStyle = q.c; ctx.fillText(q.text, hx, hy - R0 * 1.9 - a * 40);
  }
  ctx.globalAlpha = 1;
}
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  const ty = state === "idle" || state === "over" ? H * .27 : H * .48; cy += (ty - cy) * Math.min(1, dt * 6);
  const now = state === "play" || state === "calib" || state === "tut" ? clock() - latency() : performance.now() / 1000;
  moveHeart(now, dt);
  if (state === "play") update(now);
  if (state === "calib") calUpdate(now);
  if (state === "tut") tutUpdate(now);
  draw(now, dt);
  requestAnimationFrame(loop);
}
applyCfg(); resize(); hx = cx; hy = cy; hud();
homePanel();
requestAnimationFrame(t => { last = t; loop(t); });
</script>
